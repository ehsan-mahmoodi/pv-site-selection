[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pvsite"
version = "0.1.0"
description = "Multi-objective location-allocation for utility-scale PV portfolios"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]

[project.scripts]
pvsite = "pvsite.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
